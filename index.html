// ============================================================
// RANDOM (same LCG as assembly: seed = seed * 0xABCD + 1)
// ============================================================
function random(range) {
  state.seed = (state.seed * 0xABCD + 1) & 0xFFFF;
  return (state.seed % range) >>> 0;
}

// ============================================================
// BUFFER FUNCTIONS
// ============================================================
function putPixel(x, y, color) {
  if (x < 0 || x >= 320 || y < 0 || y >= 200) return;
  buf[y * 320 + x] = color;
}

function clearScreen() {
  buf.fill(0);
}

function flipBuffer() {
  for (let i = 0; i < 320 * 200; i++) {
    const c = palette[buf[i]];
    if (c) {
      data[i * 4] = c[0];
      data[i * 4 + 1] = c[1];
      data[i * 4 + 2] = c[2];
      data[i * 4 + 3] = 255;
    } else {
      data[i * 4] = 0;
      data[i * 4 + 1] = 0;
      data[i * 4 + 2] = 0;
      data[i * 4 + 3] = 255;
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

// ============================================================
// FONT RENDERING
// ============================================================
function drawChar(ch, x, y, col, italic, shadow) {
  if (y > 194) return;
  const idx = (ch - 32) * 5;
  if (idx < 0 || idx >= smallFont.length) return;

  for (let row = 0; row < 5; row++) {
    const byte = smallFont[idx + row];
    for (let col2 = 0; col2 < 5; col2++) {
      if (byte & (1 << (7 - col2))) {
        let px = x + col2;
        let py = y + row;
        if (italic) { px -= (row >> 1); }
        putPixel(px, py, col);
      }
    }
  }
}

function toCode(v) {
  return typeof v === 'number' ? v : v.charCodeAt(0);
}

function drawText(str, x, y, shadow, italic) {
  let cx = x, cy = y, initX = x;
  let curCol = 17;
  const useShadow = shadow !== undefined ? shadow : 255;

  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    const code = toCode(ch);
    if (code === 0) break;
    if (typeof ch === 'number') {
      if (ch < 32) { curCol = ch; continue; }
      if (ch === 255) { cy += 6; cx = initX; continue; }
    }
    if (useShadow !== 255) {
      drawChar(code, cx + 1, cy + 1, useShadow, false, 255);
    }
    drawChar(code, cx, cy, curCol, italic, 255);
    cx += 6;
  }
}

// ============================================================
// SPRITE / GRAPHICS RENDERING
// ============================================================
function spriteDraw(sprite, x, y, headFlag) {
  for (let row = 0; row < 8; row++) {
    for (let col2 = 0; col2 < 8; col2++) {
      const c = sprite[row * 8 + col2];
      if (c === 0) continue;
      const px = x + col2;
      const py = y + row;
      if (px < 0 || px >= 320 || py < 0 || py >= 200) continue;
      buf[py * 320 + px] = headFlag ? c + 4 : c;
    }
  }
}

function drawHL(x, y, w, color) {
  if (y < 0 || y >= 200) return;
  for (let i = 0; i < w; i++) {
    const px = x + i;
    if (px >= 0 && px < 320) buf[y * 320 + px] = color;
  }
}

function drawVL(x, y, h, color) {
  if (x < 0 || x >= 320) return;
  for (let i = 0; i < h; i++) {
    const py = y + i;
    if (py >= 0 && py < 200) buf[py * 320 + x] = color;
  }
}

function drawBox(x, y, w, h, color) {
  if (x + w > 320 || y + h > 200) return;
  for (let row = 0; row < h; row++) {
    for (let col2 = 0; col2 < w; col2++) {
      buf[(y + row) * 320 + (x + col2)] = color;
    }
  }
}

function drawWindow(x, y, w, h, color) {
  // Title bar: 7px high box only
  drawBox(x, y, w, Math.min(7, h), color);
  // Top border line
  drawHL(x, y, w, color);
  // Left border line
  drawVL(x, y, h, color);
  // Right border: at x+w-1
  drawVL(x + w - 1, y, h, color);
  // Bottom border: at y+h-1
  drawHL(x, y + h - 1, w, color);
}

// ============================================================
// RLE LOGO
// ============================================================
function drawRLELogo(offsetX, offsetY) {
  let pixelIdx = 0;
  let si = 0;

  while (si < logoData.length) {
    const count = logoData[si++];
    if (si >= logoData.length) break;
    const bits = logoData[si++];

    // Draw 'count' repetitions of this byte
    for (let rep = 0; rep < count; rep++) {
      // Draw 8 pixels from this byte (LSB first: bit 0 to bit 7)
      for (let bit = 0; bit < 8; bit++) {
        const tempX = pixelIdx % 249;
        const tempY = Math.floor(pixelIdx / 249);

        if (bits & (1 << bit)) {
          putPixel(offsetX + tempX, offsetY + tempY, 23);
        }
        pixelIdx++;
      }
    }
  }
}

function initStars() {
  for (let i = 0; i < 25; i++) {
    state.foreStarsX[i] = (random(309) + 10) >>> 0;
    state.foreStarsY[i] = (random(181) + 10) >>> 0;
    state.backStarsX[i] = (random(307) + 13) >>> 0;
    state.backStarsY[i] = (random(181) + 10) >>> 0;
  }
}

function drawStars() {
  for (let i = 0; i < 25; i++) {
    // Back stars: move 1px left
    if (state.backStarsX[i] > 0) {
      state.backStarsX[i]--;
    } else {
      state.backStarsY[i] = (random(180) + 10) >>> 0;
      state.backStarsX[i] = 318;
    }
    // Fore stars: move 2px left
    if (state.foreStarsX[i] < 2) {
      state.foreStarsY[i] = (random(180) + 10) >>> 0;
      state.foreStarsX[i] = 318;
    } else {
      state.foreStarsX[i] -= 2;
    }
  }

  for (let i = 0; i < 25; i++) {
    // Back stars
    const bx = state.backStarsX[i], by = state.backStarsY[i];
    putPixel(bx, by, 4);
    if (bx < 319) putPixel(bx + 1, by, 6);

    // Fore stars
    const fx = state.foreStarsX[i], fy = state.foreStarsY[i];
    putPixel(fx, fy, 17);
    if (fx < 319) { putPixel(fx + 1, fy, 5); }
    if (fx < 318) { putPixel(fx + 2, fy, 6); }
  }
}

// ============================================================
// SNAKE LOGIC
// ============================================================
function initSnake() {
  state.snakeX.fill(0);
  state.snakeY.fill(0);
  state.vel = 10;
  state.snakeX[0] = 19; state.snakeY[0] = 12;
  state.snakeX[1] = 18; state.snakeY[1] = 12;
  state.snakeX[2] = 17; state.snakeY[2] = 12;
  state.scount = 3;
  state.dir = 1;
  state.dotX = 0; state.dotY = 0;
  state.score = 0; state.level = 0;
}

function snakeInXY(x, y) {
  for (let i = state.scount - 1; i > 0; i--) {
    if (state.snakeX[i] === x && state.snakeY[i] === y) return true;
  }
  return false;
}

function putDot() {
  let attempts = 0;
  do {
    state.dotX = random(40) >>> 0;
    state.dotY = (random(22) + 1) >>> 0;
    attempts++;
  } while ((snakeInXY(state.dotX, state.dotY) ||
           (state.dotX === state.snakeX[0] && state.dotY === state.snakeY[0])) &&
           attempts < 200);
}

function updateSnake() {
  // Calculate speed
  let v = state.level + 1;
  v = (v << 2) + (v << 3); // v = (level+1)*12
  state.vel = v;

  // Check self-collision
  if (state.introMode === 0) {
    if (snakeInXY(state.snakeX[0], state.snakeY[0])) {
      state.gameState = 'gameover';
      return;
    }
  }

  // Check food collision
  if (state.snakeX[0] === state.dotX && state.snakeY[0] === state.dotY) {
    state.scount++;
    if (state.introMode === 0) state.score += 250;
    putDot();
    if (state.scount > 49) {
      if (state.introMode === 0) state.level++;
      state.scount = 3;
    }
  }

  // Move snake body
  for (let i = state.scount; i > 0; i--) {
    state.snakeX[i] = state.snakeX[i - 1];
    state.snakeY[i] = state.snakeY[i - 1];
  }

  // Move head
  switch (state.dir) {
    case 0: // left
      state.snakeX[0] = state.snakeX[0] === 0 ? 39 : state.snakeX[0] - 1;
      break;
    case 1: // right
      state.snakeX[0] = state.snakeX[0] === 39 ? 0 : state.snakeX[0] + 1;
      break;
    case 2: // up
      state.snakeY[0] = state.snakeY[0] === 0 ? 23 : state.snakeY[0] - 1;
      break;
    case 3: // down
      state.snakeY[0] = state.snakeY[0] === 23 ? 0 : state.snakeY[0] + 1;
      break;
  }
}

// ============================================================
// AUTOPILOT
// ============================================================
function autoPilot() {
  // Chase dot X
  if (state.snakeX[0] !== state.dotX) {
    if (state.snakeX[0] > state.dotX) {
      if (state.dir !== 0) state.dir = 0;
    } else {
      if (state.dir !== 1) state.dir = 1;
    }
  }

  // Chase dot Y
  if (state.snakeY[0] !== state.dotY) {
    if (state.snakeY[0] > state.dotY) {
      if (state.dir !== 3) state.dir = 2;
    } else {
      if (state.dir !== 2) state.dir = 3;
    }
  }

  // Avoid collision
  let nx = state.snakeX[0], ny = state.snakeY[0];
  switch (state.dir) {
    case 0: nx--; break;
    case 1: nx++; break;
    case 2: ny--; break;
    case 3: ny++; break;
  }
  if (nx < 0) nx = 39; if (nx > 39) nx = 0;
  if (ny < 0) ny = 23; if (ny > 23) ny = 0;

  if (snakeInXY(nx, ny)) {
    if (state.dir === 0) { state.dir = 2; }
    else if (state.dir === 1) { state.dir = 3; }
    else if (state.dir === 2) { state.dir = 1; }
    else if (state.dir === 3) { state.dir = 0; }
  }
}

// ============================================================
// HELPERS
// ============================================================
function numToStr(n) {
  const s = n.toString();
  const r = [];
  for (let i = 0; i < s.length; i++) r.push(s.charCodeAt(i));
  r.push(0);
  return r;
}

// ============================================================
// DRAWING FUNCTIONS
// ============================================================
function drawScreen() {
  // Draw dot
  let rx = state.dotX * 8, ry = state.dotY * 8;
  spriteDraw(dotSprite, rx, ry, 0);

  // Orbiting dot (FPU effect)
  const angleRad = state.angle * Math.PI / state.degPi;
  const tx = Math.round(state.radius * Math.cos(angleRad));
  const ty = Math.round(state.radius * Math.sin(angleRad));
  spriteDraw(dotSprite, rx + ty, ry + tx, 0);

  state.angle -= 6;
  if (state.angle <= 0) state.angle = 360;

  // Draw snake
  for (let i = state.scount - 1; i >= 0; i--) {
    const sx = state.snakeX[i] * 8, sy = state.snakeY[i] * 8;
    spriteDraw(snakeBody, sx, sy, i === 0 ? 1 : 0);
  }
}

function drawStatus() {
  drawBox(1, 191, 318, 8, 8);

  drawText(S.ScoreText, 5, 194);
  drawText(numToStr(state.score), 45, 194);

  drawText(S.LevelText, 125, 194);
  drawText(numToStr(state.level), 165, 194);
}

function drawCredits() {
  drawText(S.GameTitle, 1, 1, 22, true);
  drawText(S.Ver, 250, 1, 1);
}

function drawDebugger() {
  drawWindow(230, 10, 87, 65, 15);
  drawText(S.DebugTitle, 252, 12, 0);

  // Draw labels at x=234 (inside window, 4px padding)
  // Values drawn at current Font.X after label
  const baseX = 234;

  drawText(S.DotXStr, baseX, 20);
  drawText(numToStr(state.dotX), baseX + 36, 20); // After "DOT_X:" (6 chars * 6px)

  drawText(S.DotYStr, baseX, 28);
  drawText(numToStr(state.dotY), baseX + 36, 28); // After "DOT_Y:" (6 chars * 6px)

  drawText(S.SnakeXStr, baseX, 36);
  drawText(numToStr(state.snakeX[0]), baseX + 48, 36); // After "SNAKE_X:" (8 chars * 6px)

  drawText(S.SnakeYStr, baseX, 44);
  drawText(numToStr(state.snakeY[0]), baseX + 48, 44); // After "SNAKE_Y:" (8 chars * 6px)

  drawText(S.SnakeStr, baseX, 52);
  drawText(numToStr(state.scount), baseX + 30, 52); // After "SIZE:" (5 chars * 6px)

  drawText(S.SSStr, baseX, 60);
  drawText(numToStr(state.showStars), baseX + 60, 60); // After "SHOWSTARS:" (10 chars * 6px)

  drawText(S.SnakeDirStr, baseX, 68);
  // Draw direction at current position after "DIRECAO:" (8 chars * 6px)
  const dirX = baseX + 48;
  if (state.dir === 0) drawText(S.LeftStr, dirX, 68);
  else if (state.dir === 1) drawText(S.RightStr, dirX, 68);
  else if (state.dir === 2) drawText(S.UpStr, dirX, 68);
  else if (state.dir === 3) drawText(S.DownStr, dirX, 68);
}

function drawGame() {
  // Update speed
  state.velCount += state.vel;
  if (state.velCount >= 100) {
    state.velCount = 0;
    state.score++;
    updateSnake();
  }

  clearScreen();
  if (state.showStars) drawStars();
  drawScreen();
  drawStatus();
  if (state.showDebug) drawDebugger();
  drawCredits();
  flipBuffer();
}

function drawIntro() {
  state.introMode = 1;
  autoPilot();
  updateSnake();
  clearScreen();
  if (state.showStars) drawStars();
  drawScreen();
  drawRLELogo(35, 15);
  drawText(S.PressAKey, 65, 82);
  drawText(S.Credits, 220, 194);
  flipBuffer();
}


function drawInstructions() {
  clearScreen();
  drawWindow(50, 30, 220, 84, 23);
  drawText(S.InstrTitle, 120, 31, 0);
  drawText(S.Instruct, 60, 45);
  drawText(S.PressAKey, 65, 103);
  flipBuffer();
}

// ============================================================
// GAME INITIALIZATION
// ============================================================
function initGame() {
  initSnake();
  state.introMode = 0;
  state.radius = 4;
  state.degPi = 180;
  state.angle = 360;
  state.showDebug = 0;
  state.showStars = 1;
  putDot();
  state.gameState = 'intro';
}

// ============================================================
// INPUT
// ============================================================
const keys = {};
const justPressed = new Set();

document.addEventListener('keydown', (e) => {
  if (!keys[e.keyCode]) {
    justPressed.add(e.keyCode);
  }
  keys[e.keyCode] = true;
  if ([32, 37, 38, 39, 40, 68, 83, 13, 27].includes(e.keyCode)) {
    e.preventDefault();
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.keyCode] = false;
});

// ============================================================
// GAME LOOP
// ============================================================
function consumeKey(k) {
  justPressed.delete(k);
}

function gameLoop() {
  // Read all pending keys
  const keysToHandle = [...justPressed];

  if (state.gameState === 'intro') {
    drawIntro();
    for (const k of keysToHandle) {
      if (k === 32) { // Space
        consumeKey(k);
        state.introMode = 0;
        initGame();
        state.gameState = 'game';
        break;
      } else if (k === 27) { // Esc
        consumeKey(k);
        state.gameState = 'credits';
        break;
      }
    }
  } else if (state.gameState === 'game') {
    for (const k of keysToHandle) {
      if (k === 38 && state.dir !== 3) { state.dir = 2; consumeKey(k); break; } // Up
      else if (k === 40 && state.dir !== 2) { state.dir = 3; consumeKey(k); break; } // Down
      else if (k === 37 && state.dir !== 1) { state.dir = 0; consumeKey(k); break; } // Left
      else if (k === 39 && state.dir !== 0) { state.dir = 1; consumeKey(k); break; } // Right
    }
    for (const k of keysToHandle) {
      // Debug: Enter increases level
      if (k === 13 && state.showDebug) {
        state.level = (state.level + 1) % 10; consumeKey(k);
      }
      // D: toggle debug
      if (k === 68) { state.showDebug = state.showDebug ? 0 : 1; consumeKey(k); }
      // S: toggle stars
      if (k === 83) { state.showStars = state.showStars ? 0 : 1; consumeKey(k); }
      // Space: pause
      if (k === 32) { state.gameState = 'pause'; consumeKey(k); }
      // Esc: quit
      if (k === 27) { state.gameState = 'credits'; consumeKey(k); }
    }
    drawGame();
  } else if (state.gameState === 'pause') {
    drawInstructions();
    for (const k of keysToHandle) {
      if (k === 32 || k === 27) { state.gameState = 'game'; consumeKey(k); }
    }
  } else if (state.gameState === 'gameover') {
    drawWindow(30, 65, 260, 60, 1);
    drawText(S.GOverTitle, 120, 66, 0);
    flipBuffer();
    drawText(S.GameOver, 26, 90);
    flipBuffer();
    for (const k of keysToHandle) {
      if (k === 13) { consumeKey(k); initGame(); state.gameState = 'game'; }
      if (k === 27) { consumeKey(k); state.gameState = 'credits'; }
    }
  } else if (state.gameState === 'credits') {
    clearScreen();
    drawText(S.FinalCredits, 40, 10);
    drawText(S.PressAnyKey, 80, 187);
    flipBuffer();
    for (const k of keysToHandle) {
      consumeKey(k);
      state.gameState = 'intro';
      initGame();
      break;
    }
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================
// START
// ============================================================
initStars();
initGame();
state.gameState = 'intro';
gameLoop();
</script>
